# Operator-controlled watch. The console writes this file; do not put credentials here.
# Markets must be ones the tenant listed. A writes journey needs allowWrites: true.
tenantId: example
enabled: false
mode: periodic
everyMinutes: 240
restSeconds: 60
markets:
  - oslo
  - bergen
devices:
  - desktop
journeys:
  - landing-page
  - browse
  - search
targets:
  - https://xala.no
maxConcurrent: 2
allowWrites: false
journeyPick: seeded
e2e:
  everyMinutes: 720
  journeys:
    - market: oslo
      device: desktop
      journey: login
      url: https://app.example.com/login
targetJourneys: {}
