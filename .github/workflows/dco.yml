name: DCO

# Every commit needs a `Signed-off-by` trailer (see CONTRIBUTING.md) — this
# checks the PR's own commit range rather than a third-party App, so it needs
# no installation step and works the same on a fork.
on:
  pull_request:

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: '; then
              echo "::error::commit $sha is missing a Signed-off-by trailer — see CONTRIBUTING.md (git commit -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
