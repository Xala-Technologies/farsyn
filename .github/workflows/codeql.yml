name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches a new query pack finding something in code that didn't change —
    # a push/PR trigger alone only re-scans what a diff touches.
    - cron: "24 7 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
